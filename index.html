<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Fit Check - Low-fi Prototype</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#e9ecef;margin:0;display:flex;justify-content:center;padding:16px;color:#222}
.wrap{width:100%;max-width:380px}
.phone{background:#fff;border:3px solid #333;border-radius:22px;min-height:620px;padding:16px;position:relative}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 6px}
.step{font-size:11px;color:#777;margin-bottom:8px}
label{display:block;font-size:13px;margin:8px 0 3px}
input,select{width:100%;padding:9px;border:1.5px solid #555;border-radius:6px;font-size:14px}
button{cursor:pointer;font-size:14px;border:2px solid #333;background:#fff;border-radius:8px;padding:10px;margin-top:8px}
button.p{background:#333;color:#fff;width:100%}button.w{width:100%}
.card{border:2px solid #333;border-radius:8px;padding:10px;margin:8px 0;background:#f8f9fa;font-size:13px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;margin:0}.tabs .on{background:#333;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #555;border-radius:8px;padding:9px;margin:6px 0;cursor:pointer;font-size:13px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.fit{background:#2e7d32}.partial{background:#ef9a00}.nofit{background:#c62828}.none{background:#888}
.badge{font-size:28px;font-weight:bold;text-align:center;padding:14px;border-radius:10px;color:#fff;margin:8px 0}
.bar{height:14px;background:#ddd;border-radius:7px;overflow:hidden;margin:3px 0 8px}.bar div{height:100%;background:#333}
.tag{display:inline-block;font-size:11px;border:1.5px solid #333;border-radius:4px;padding:1px 6px;font-weight:bold}
.row{display:flex;gap:6px}.row button{flex:1}.small{font-size:11px;color:#666}
.nav{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}.nav a{color:#06c;cursor:pointer}
.sel{background:#333;color:#fff}.dots{text-align:center;font-size:11px;color:#777;margin-top:8px}
</style></head><body><div class="wrap"><div class="phone" id="app"></div>
<div class="dots">Low-fidelity prototype. All numbers are dummy values, not medical advice.</div></div>
<script>
const FIXED=[{n:"Whole-wheat bread (2 slices)",p:8,c:180,f:1.5},{n:"Packaged chicken sandwich",p:15,c:290,f:1.2},{n:"Soy milk (250 ml)",p:8,c:130,f:1.1},{n:"Protein drink",p:20,c:150,f:1.1}];
const MEAL=[{n:"Chicken breast rice box",p:35,c:520},{n:"Roast meat rice",p:22,c:780},{n:"Miso beef rice",p:28,c:680},{n:"Vegetable rice box",p:9,c:450}];
const PORT={"Small":0.8,"Regular":1,"Large":1.3};
let S={screen:1,tab:"fixed",target:null,item:null,port:"Regular",today:{p:0,c:0,list:[]},form:{sex:"M",age:21,h:175,w:70,act:1.55,goal:"cut"}};
const ACT={"1.375":"Light (1-3 days)","1.55":"Moderate (3-5 days)","1.725":"High (6-7 days)"};
const $=document.getElementById("app");
function calc(f){let bmr=10*f.w+6.25*f.h-5*f.age+(f.sex=="M"?5:-161);let tdee=bmr*f.act;
 let adj={cut:-400,maintain:0,build:300}[f.goal];let kcal=Math.round((tdee+adj)/10)*10;
 let r={cut:[1.6,2.2],build:[1.6,2.2],maintain:[1.2,2.0]}[f.goal];
 return{kcal,pmin:Math.round(f.w*r[0]),pmax:Math.round(f.w*r[1])}}
function est(it){let k=PORT[S.port];let p=it.p*k,c=it.c*k;
 if(it.fixed)return{p:[p,p],c:[c,c],src:"fixed value",label:"Fixed value"};
 return{p:[Math.round(p*.8),Math.round(p*1.2)],c:[Math.round(c*.85),Math.round(c*1.15)],src:"AI estimate",label:"AI estimate"}}
function verdict(it){let e=est(it),t=S.target;let pm=(t.pmin+t.pmax)/2/3;let cm=t.kcal/3;
 let pAvg=(e.p[0]+e.p[1])/2,cAvg=(e.c[0]+e.c[1])/2;let r=pAvg/pm,v;
 v=r>=.9?"fit":r>=.6?"partial":"nofit";
 if(cAvg>cm*1.25&&v=="fit")v="partial";
 return{v,pm:Math.round(pm),cm:Math.round(cm),short:Math.max(0,Math.round(pm-pAvg)),e,pAvg,cAvg}}
const TXT={fit:"FIT",partial:"PARTIAL FIT",nofit:"NO FIT"};
function nav(back,next){return`<div class="nav"><a onclick="go(${back})">${back?"&larr; Back":""}</a><span class="small">Screen ${S.screen} of 5</span><a onclick="go(${next})">${next?"Next &rarr;":""}</a></div>`}
function go(n){S.screen=n;draw()}
function draw(){let h="";
if(S.screen==1){let f=S.form,r=S.target||calc(f);
h=`<div class="step">S1 Set daily target (one time)</div><h1>Your daily target</h1><div class="small">Enter your body details. Data stays on your phone.</div>
<label>Sex</label><select onchange="S.form.sex=this.value"><option value="M" ${f.sex=="M"?"selected":""}>Male</option><option value="F" ${f.sex=="F"?"selected":""}>Female</option></select>
<div class="row"><div><label>Age</label><input type="number" value="${f.age}" onchange="S.form.age=+this.value"></div><div><label>Height cm</label><input type="number" value="${f.h}" onchange="S.form.h=+this.value"></div><div><label>Weight kg</label><input type="number" value="${f.w}" onchange="S.form.w=+this.value"></div></div>
<label>Training</label><select onchange="S.form.act=+this.value">${Object.entries(ACT).map(([k,v])=>`<option value="${k}" ${f.act==k?"selected":""}>${v}</option>`).join("")}</select>
<label>Goal</label><select onchange="S.form.goal=this.value"><option value="cut" ${f.goal=="cut"?"selected":""}>Cut</option><option value="maintain" ${f.goal=="maintain"?"selected":""}>Maintain</option><option value="build" ${f.goal=="build"?"selected":""}>Build</option></select>
<button class="w" onclick="S.target=calc(S.form);draw()">Calculate</button>
${S.target?`<div class="card"><b>Your daily range</b><br>${S.target.kcal} kcal<br>Protein ${S.target.pmin}-${S.target.pmax} g<div class="small">General estimate, not medical advice. You can edit it.</div>
<label>Edit kcal</label><input type="number" value="${S.target.kcal}" onchange="S.target.kcal=+this.value">
<div class="row"><div><label>Protein min g</label><input type="number" value="${S.target.pmin}" onchange="S.target.pmin=+this.value"></div><div><label>Protein max g</label><input type="number" value="${S.target.pmax}" onchange="S.target.pmax=+this.value"></div></div></div>
<button class="p" onclick="go(2)">Save and continue</button>`:""}`;}
else if(S.screen==2){
if(!S.target){S.target=calc(S.form)}
let t=S.tab;
h=`<div class="step">S2 Choose item or add photo</div><h1>What are you eating?</h1>
<div class="tabs"><button class="${t=="fixed"?"on":""}" onclick="S.tab='fixed';draw()">Fixed items</button><button class="${t=="meal"?"on":""}" onclick="S.tab='meal';draw()">Meals (photo)</button></div>`;
if(t=="fixed")h+=FIXED.map((x,i)=>{let it={...x,fixed:1};let v=verdict(it).v;return`<div class="item" onclick="pick(${i},1)"><span>${x.n}<br><span class="small">${x.p} g protein, ${x.c} kcal</span></span><span class="chip ${v}">${TXT[v]}</span></div>`}).join("");
else h+=`<div class="row"><button onclick="photo()">Take photo</button><button onclick="photo()">Upload photo</button></div><div class="small">Prototype: a photo picks a random meal (mock AI). Or choose manually:</div>`+MEAL.map((x,i)=>`<div class="item" onclick="pick(${i},0)"><span>${x.n}<br><span class="small">AI estimate</span></span><span class="chip none">?</span></div>`).join("");
h+=nav(1,0);}
else if(S.screen==3){let it=S.item,r=verdict(it),c={fit:"fit",partial:"partial",nofit:"nofit"}[r.v];
h=`<div class="step">S3 Fit result</div><h1>${it.n}</h1><span class="tag">${r.e.label}</span>
<div class="badge ${c}">${TXT[r.v]}</div>
<div>Protein: ${r.e.p[0]==r.e.p[1]?r.e.p[0]:r.e.p[0]+"-"+r.e.p[1]} g (meal target ~${r.pm} g)</div><div class="bar"><div style="width:${Math.min(100,r.pAvg/r.pm*100)}%"></div></div>
<div>Calories: ${r.e.c[0]==r.e.c[1]?r.e.c[0]:r.e.c[0]+"-"+r.e.c[1]} kcal (meal budget ~${r.cm})</div><div class="bar"><div style="width:${Math.min(100,r.cAvg/r.cm*100)}%"></div></div>
<div class="card">${r.short>0?`Shortfall: about ${r.short} g protein for this meal.`:"Meets this meal's protein share."}</div>
<button class="w" onclick="go(4)">See details and adjust</button><button class="p" onclick="add()">Add to today</button>${nav(2,4)}`;}
else if(S.screen==4){let it=S.item,r=verdict(it);
h=`<div class="step">S4 Details and adjust</div><h1>${it.n}</h1>
<div class="card"><span class="tag">${r.e.label}</span><br>Protein ${r.e.p[0]}-${r.e.p[1]} g<br>Calories ${r.e.c[0]}-${r.e.c[1]} kcal<br>Source: ${it.fixed?"stored label value (dummy)":"AI photo estimate (dummy), range shown"}</div>
<h2>Portion</h2><div class="row">${Object.keys(PORT).map(k=>`<button class="${S.port==k?"sel":""}" onclick="S.port='${k}';draw()">${k}</button>`).join("")}</div>
<div class="badge ${r.v}" style="font-size:18px">${TXT[r.v]}</div>
<button class="w" onclick="alert('Thanks. Mismatch reported (prototype only).')">Report a mismatch</button><button class="p" onclick="add()">Add to today</button>${nav(3,5)}`;}
else{let t=S.target,d=S.today;let pr=Math.max(0,Math.round((t.pmin+t.pmax)/2-d.p)),cr=Math.max(0,Math.round(t.kcal-d.c));
h=`<div class="step">S5 Add to today</div><h1>Today</h1>
<div class="card">Eaten: ${Math.round(d.p)} g protein, ${Math.round(d.c)} kcal</div>
<div>Protein left (to mid-range ${Math.round((t.pmin+t.pmax)/2)} g): <b>${pr} g</b></div><div class="bar"><div style="width:${Math.min(100,d.p/((t.pmin+t.pmax)/2)*100)}%"></div></div>
<div>Calories left: <b>${cr} kcal</b></div><div class="bar"><div style="width:${Math.min(100,d.c/t.kcal*100)}%"></div></div>
<h2>Logged</h2>${d.list.length?d.list.map(x=>`<div class="small">- ${x}</div>`).join(""):'<div class="small">Nothing yet.</div>'}
<button class="p" onclick="go(2)">Check another item</button><button class="w" onclick="S.today={p:0,c:0,list:[]};draw()">Reset today</button>${nav(4,0)}`;}
$.innerHTML=h}
function pick(i,fx){S.item=fx?{...FIXED[i],fixed:1}:{...MEAL[i]};S.port="Regular";go(3)}
function photo(){let i=Math.floor(Math.random()*MEAL.length);pick(i,0)}
function add(){let r=verdict(S.item);S.today.p+=r.pAvg;S.today.c+=r.cAvg;S.today.list.push(S.item.n+" ("+S.port+")");go(5)}
draw();
</script></body></html>
